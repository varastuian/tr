name: Build Windows EXE

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install nuitka
          pip install .

      - name: Build EXE
        run: |
          cd backend
          python -m nuitka src/uav_route/cli_simplify_route.py --onefile --standalone --assume-yes-for-downloads --output-dir=build --output-filename=uav_route.exe
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: backend/build/*.exe
